name: docker-image

# Publishing is intentionally disabled in this fork. Fork maintainers must configure
# a fork-owned container registry and review credentials and tags before enabling push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-only:
    name: build ${{ matrix.platform }} without publishing
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            artifact: cli-proxy-api-compaction-amd64.tar
          - platform: linux/arm64
            artifact: cli-proxy-api-compaction-arm64.tar
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without registry push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.artifact }}
          tags: local/cli-proxy-api-compaction:manual
